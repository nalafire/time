<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友出遊喬時間神器 (手動版)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Apple LiGothic Medium', sans-serif;
            background-color: #f5f6fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        
        /* 輸入表單區塊 */
        .form-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            justify-content: center;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-weight: bold;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            min-width: 150px;
        }
        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .btn-clear {
            background-color: #e74c3c;
        }
        .btn-clear:hover {
            background-color: #c0392b;
        }

        /* 行事曆看板區塊 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .day-card {
            background: white;
            border-radius: 12px;
            padding: 15px 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 180px;
            position: relative;
        }
        .date-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #34495e;
            margin-bottom: 12px;
        }

        /* 狀態點點 */
        .status-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .green {
            background-color: #2ecc71;
            box-shadow: 0 0 8px rgba(46,204,113,0.5);
        }
        .empty {
            background-color: transparent;
            border: 2px dashed #bdc3c7;
        }

        /* 忙碌名單列表 */
        .busy-list {
            font-size: 0.85rem;
            color: #555;
            width: 100%;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 8px;
            overflow-y: auto;
            max-height: 100px;
        }
        .busy-item {
            margin-bottom: 4px;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
        }
        .delete-item-btn {
            color: #e74c3c;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 朋友出遊喬時間神器</h1>

    <div class="form-section">
        <div class="form-group">
            <label for="eventDate">選擇日期</label>
            <select id="eventDate">
                </select>
        </div>
        <div class="form-group">
            <label for="personName">誰沒空？ (名字)</label>
            <input type="text" id="personName" placeholder="例如：小明" required>
        </div>
        <div class="form-group">
            <label for="eventTitle">要做什麼？ (活動)</label>
            <input type="text" id="eventTitle" placeholder="例如：補習班" required>
        </div>
        <button onclick="addEvent()">新增行程</button>
        <button class="btn-clear" onclick="clearAllData()">全部清空</button>
    </div>

    <div class="calendar-grid" id="calendarGrid">
        </div>
</div>

<script>
    // 預設產生的日期範圍（這裡設定 5/11 ~ 5/20，你可以自由修改下面這個陣列）
    const dateList = ["5/11", "5/12", "5/13", "5/14", "5/15", "5/16", "5/17", "5/18", "5/19", "5/20"];

    // 從瀏覽器紀錄抓取資料，若沒有就建立空的
    let scheduleData = JSON.parse(localStorage.getItem('friendGroupSchedule')) || {};

    // 初始化：填入下拉選單與渲染行事曆
    function init() {
        const dateSelect = document.getElementById('eventDate');
        dateSelect.innerHTML = '';
        dateList.forEach(date => {
            let opt = document.createElement('option');
            opt.value = date;
            opt.innerText = date;
            dateSelect.appendChild(opt);
        });
        renderCalendar();
    }

    // 渲染行事曆畫面
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        dateList.forEach(date => {
            const card = document.createElement('div');
            card.className = 'day-card';

            // 日期標題
            const title = document.createElement('div');
            title.className = 'date-title';
            title.innerText = date;
            card.appendChild(title);

            // 檢查這天有沒有人有行程
            const dayEvents = scheduleData[date] || [];
            const hasEvents = dayEvents.length > 0;

            // 狀態點點：有行程變空缺，沒行程亮綠燈
            const dot = document.createElement('div');
            dot.className = hasEvents ? 'status-dot empty' : 'status-dot green';
            card.appendChild(dot);

            // 底下列表：顯示名字與活動
            const busyList = document.createElement('div');
            busyList.className = 'busy-list';

            if (hasEvents) {
                dayEvents.forEach((ev, index) => {
                    const item = document.createElement('div');
                    item.className = 'busy-item';
                    item.innerHTML = `<span><strong>${ev.name}</strong> (${ev.title})</span>`;
                    
                    // 個別刪除按鈕
                    const delBtn = document.createElement('span');
                    delBtn.className = 'delete-item-btn';
                    delBtn.innerText = '×';
                    delBtn.onclick = () => deleteEvent(date, index);
                    
                    item.appendChild(delBtn);
                    busyList.appendChild(item);
                });
            } else {
                busyList.style.textAlign = 'center';
                busyList.style.color = '#2ecc71';
                busyList.innerText = '全員有空！';
            }
            
            card.appendChild(busyList);
            grid.appendChild(card);
        });
    }

    // 新增行程功能
    function addEvent() {
        const date = document.getElementById('eventDate').value;
        const name = document.getElementById('personName').value.trim();
        const title = document.getElementById('eventTitle').value.trim();

        if (!name || !title) {
            alert('請填寫名字與活動內容喔！');
            return;
        }

        // 如果這天還沒有資料，先開一個新陣列
        if (!scheduleData[date]) {
            scheduleData[date] = [];
        }

        // 把人名和活動推進去
        scheduleData[date].push({ name: name, title: title });

        // 儲存並重新渲染
        saveData();
        renderCalendar();

        // 清空輸入框
        document.getElementById('personName').value = '';
        document.getElementById('eventTitle').value = '';
    }

    // 刪除單一行程
    function deleteEvent(date, index) {
        scheduleData[date].splice(index, 1);
        if (scheduleData[date].length === 0) {
            delete scheduleData[date];
        }
        saveData();
        renderCalendar();
    }

    // 清空全部資料
    function clearAllData() {
        if (confirm('確定要清空所有人記錄的行程嗎？')) {
            scheduleData = {};
            saveData();
            renderCalendar();
        }
    }

    // 儲存到瀏覽器
    function saveData() {
        localStorage.setItem('friendGroupSchedule', JSON.stringify(scheduleData));
    }

    // 啟動
    init();
</script>

</body>
</html>
